name: Update README cards

on:
  schedule:
    - cron: "27 0 * * *"
  workflow_dispatch:

concurrency:
  group: update-readme-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=transparent&hide=contribs,prs&custom_title=Henghua%20Zhang's%20GitHub%20Stats&card_width=437&line_height=30&show_icons=true&include_all_commits=true&title_color=b860ff&icon_color=b860ff&text_color=1f2328
          path: profile/stats.svg
          token: ${{ secrets.PAT_FOR_STAT }}

      - name: Generate stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=transparent&hide=contribs,prs&custom_title=Henghua%20Zhang's%20GitHub%20Stats&card_width=437&line_height=30&show_icons=true&include_all_commits=true&title_color=b860ff&icon_color=b860ff&text_color=c9d1d9
          path: profile/stats-dark.svg
          token: ${{ secrets.PAT_FOR_STAT }}

      - name: Generate top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=transparent&hide=typescript,html,css,scss,tex&layout=compact&size_weight=0.9&count_weight=0.1&title_color=b860ff&text_color=1f2328&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_FOR_STAT }}

      - name: Generate top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=transparent&hide=typescript,html,css,scss,tex&layout=compact&size_weight=0.9&count_weight=0.1&title_color=b860ff&text_color=c9d1d9&langs_count=8
          path: profile/top-langs-dark.svg
          token: ${{ secrets.PAT_FOR_STAT }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update README cards"
          git push
