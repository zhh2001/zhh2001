name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@V1.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=transparent&hide=contribs,prs&custom_title=Henghua%20Zhang's%20GitHub%20Stats&card_width=437&line_height=30&show_icons=true&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@V1.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=transparent&hide=html,css,scss&layout=compact&size_weight=0.9&count_weight=0.1
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git remote set-url origin https://${{ github.actor }}:${{ secrets.PAT_FOR_PUSH }}@github.com/${{ github.repository }}.git
          git push
