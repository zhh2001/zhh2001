<svg xmlns="http://www.w3.org/2000/svg" width="960" height="252" viewBox="0 0 960 252" role="img" aria-labelledby="title description">
  <title id="title">Henghua Zhang · zhh2001</title>
  <desc id="description">SDN, P4, and in-band network telemetry. A P4Runtime controller configures a BMv2 switch, with packets flowing between two hosts.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#080e19" />
      <stop offset="1" stop-color="#10182c" />
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#22d3ee" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#94a3b8" stroke-opacity="0.06" />
    </pattern>
    <clipPath id="window"><rect x="1" y="1" width="958" height="250" rx="14" /></clipPath>
  </defs>
  <style>
    .packet { stroke-dasharray: 8 16; animation: flow 3.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -96; } }
    @media (prefers-reduced-motion: reduce) { .packet { animation: none; } }
  </style>
  <g clip-path="url(#window)">
    <rect width="960" height="252" fill="url(#background)" />
    <rect y="35" width="960" height="217" fill="url(#grid)" />
    <rect width="960" height="35" fill="#131c2c" />
    <path d="M0 35H960" stroke="#26334a" />
    <path d="M0 250H960" stroke="url(#accent)" stroke-width="2" />
  </g>
  <rect x="1" y="1" width="958" height="250" rx="14" fill="none" stroke="#27354d" />
  <circle cx="22" cy="18" r="4.5" fill="#fb7185" />
  <circle cx="38" cy="18" r="4.5" fill="#fbbf24" />
  <circle cx="54" cy="18" r="4.5" fill="#4ade80" />
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="78" y="23" font-size="12" fill="#94a3b8">zhh2001@github:~</text>
    <text x="36" y="91" font-size="13" letter-spacing="2" fill="#22d3ee">SDN / P4</text>
    <text x="34" y="147" font-size="44" font-weight="700" letter-spacing="-1.5" fill="#f1f5f9">Henghua Zhang</text>
    <text x="36" y="182" font-size="18" fill="#a5b4cf">In-band network telemetry</text>

    <path d="M740 116V166" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 8" />
    <text x="756" y="146" font-size="13" fill="#c4b5fd">P4Runtime</text>
    <path d="M632 195H680M800 195H848" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="2" />
    <path class="packet" d="M632 195H680M800 195H848" fill="none" stroke="#22d3ee" stroke-width="2" />

    <rect x="666" y="70" width="148" height="46" rx="8" fill="#19172c" stroke="#7660b0" />
    <text x="740" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#ddd6fe">CONTROLLER</text>
    <rect x="680" y="166" width="120" height="58" rx="8" fill="#0b2030" stroke="#22d3ee" />
    <text x="740" y="189" text-anchor="middle" font-size="14" font-weight="700" fill="#a5f3fc">P4 SWITCH</text>
    <text x="740" y="210" text-anchor="middle" font-size="13" fill="#8dc6d5">BMv2</text>
    <rect x="554" y="176" width="78" height="38" rx="7" fill="#0e1b23" stroke="#365363" />
    <text x="593" y="200" text-anchor="middle" font-size="13" fill="#b9d5de">HOST A</text>
    <rect x="848" y="176" width="78" height="38" rx="7" fill="#0e1b23" stroke="#365363" />
    <text x="887" y="200" text-anchor="middle" font-size="13" fill="#b9d5de">HOST B</text>
  </g>
</svg>
