<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title description">
  <title id="title">Henghua Zhang · zhh2001</title>
  <desc id="description">A terminal and network topology for programmable networks, SDN, P4, in-band telemetry, and Go/Python tools. A P4Runtime controller connects to a BMv2 switch between two hosts.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="960" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080e19" />
      <stop offset="1" stop-color="#10182c" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" />
      <stop offset="0.55" stop-color="#818cf8" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#94a3b8" stroke-opacity="0.06" />
    </pattern>
    <clipPath id="window"><rect x="1" y="1" width="958" height="318" rx="16" /></clipPath>
  </defs>
  <style>
    .packet { stroke-dasharray: 8 14; animation: flow 2.8s linear infinite; }
    .control { stroke-dasharray: 4 8; animation: flow 3.6s linear infinite reverse; }
    .beacon { transform-box: fill-box; transform-origin: center; animation: pulse 3s ease-in-out infinite; }
    .cursor { animation: blink 1.2s steps(2, end) infinite; }
    @keyframes flow { to { stroke-dashoffset: -88; } }
    @keyframes pulse { 50% { opacity: 0.25; transform: scale(1.12); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .packet, .control, .beacon, .cursor { animation: none; } }
  </style>
  <g clip-path="url(#window)">
    <rect width="960" height="320" fill="url(#background)" />
    <rect y="35" width="960" height="285" fill="url(#grid)" />
    <rect width="960" height="35" fill="#131c2c" />
    <path d="M0 35H960" stroke="#26334a" />
    <path d="M0 318H960" stroke="url(#accent)" stroke-width="3" />
  </g>
  <rect x="1" y="1" width="958" height="318" rx="16" fill="none" stroke="#27354d" />
  <circle cx="22" cy="18" r="4.5" fill="#fb7185" />
  <circle cx="38" cy="18" r="4.5" fill="#fbbf24" />
  <circle cx="54" cy="18" r="4.5" fill="#4ade80" />
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="78" y="23" font-size="12" fill="#94a3b8">zhh2001@github:~</text>
    <text x="40" y="78" font-size="11" letter-spacing="2" fill="#22d3ee">SDN / P4</text>
    <text x="38" y="130" font-size="44" font-weight="700" letter-spacing="-1.5" fill="#f1f5f9">Henghua Zhang</text>
    <text x="40" y="160" font-size="17" fill="#a5b4cf">In-band network telemetry</text>
    <rect x="40" y="185" width="456" height="95" rx="10" fill="#080f1d" stroke="#25344c" />
    <text x="56" y="208" font-size="13" fill="#4ade80">$ cat profile</text>
    <rect class="cursor" x="174" y="196" width="7" height="14" fill="#4ade80" />
    <text x="56" y="235" font-size="14" fill="#64748b">network</text>
    <text x="146" y="235" font-size="14" fill="#e2e8f0">P4Runtime · BMv2</text>
    <text x="56" y="260" font-size="14" fill="#64748b">build</text>
    <text x="146" y="260" font-size="14" fill="#e2e8f0">Go · Python</text>

    <rect x="536" y="56" width="404" height="232" rx="12" fill="#0a1221" stroke="#1d2e45" />
    <text x="554" y="79" font-size="10" letter-spacing="1.5" fill="#64748b">CONTROL + DATA PLANE</text>
    <path d="M738 140V198" fill="none" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="2" />
    <path class="control" d="M738 140V198" fill="none" stroke="#a78bfa" stroke-width="2" />
    <text x="752" y="173" font-size="11" fill="#a78bfa">P4Runtime</text>
    <path d="M628 231H672M804 231H848" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="2" />
    <path class="packet" d="M628 231H672M804 231H848" fill="none" stroke="#22d3ee" stroke-width="2" />
    <circle class="beacon" cx="738" cy="230" r="43" fill="none" stroke="#22d3ee" stroke-opacity="0.3" />

    <rect x="654" y="91" width="168" height="49" rx="8" fill="#19172c" stroke="#7660b0" />
    <circle cx="670" cy="107" r="3" fill="#a78bfa" />
    <text x="738" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#ddd6fe">CONTROLLER</text>
    <text x="738" y="130" text-anchor="middle" font-size="10" fill="#a78bfa">Go / P4Runtime</text>
    <rect x="672" y="198" width="132" height="64" rx="9" fill="#0b2030" stroke="#22d3ee" />
    <text x="738" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#a5f3fc">P4 SWITCH</text>
    <text x="738" y="246" text-anchor="middle" font-size="11" fill="#67b8cc">BMv2</text>
    <rect x="548" y="210" width="80" height="42" rx="7" fill="#0e1b23" stroke="#365363" />
    <text x="588" y="236" text-anchor="middle" font-size="12" fill="#b9d5de">HOST A</text>
    <rect x="848" y="210" width="80" height="42" rx="7" fill="#0e1b23" stroke="#365363" />
    <text x="888" y="236" text-anchor="middle" font-size="12" fill="#b9d5de">HOST B</text>
  </g>
</svg>
